<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星脚本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#060b18;padding:20px;position:relative;overflow-x:hidden}
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.container{max-width:600px;width:100%;position:relative;z-index:1}
.auth-box{background:rgba(10,15,35,0.6);backdrop-filter:blur(16px);border-radius:20px;padding:30px 25px;box-shadow:0 8px 40px rgba(0,0,0,0.6);border:1px solid rgba(120,160,255,0.12)}
.auth-box h2{text-align:center;font-size:24px;color:#fff;font-weight:600}
.auth-box .sub{text-align:center;color:rgba(180,200,255,0.5);font-size:14px;margin-bottom:20px}
.auth-box input{width:100%;padding:13px 16px;border:1px solid rgba(120,160,255,0.15);border-radius:12px;font-size:15px;margin-bottom:12px;background:rgba(255,255,255,0.04);color:#e8eeff;outline:none}
.auth-box input::placeholder{color:rgba(180,200,255,0.25)}
.auth-box .btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,#4A6CF7,#8b5cf6);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.auth-box .switch{text-align:center;margin-top:16px;font-size:14px;color:rgba(180,200,255,0.4)}
.auth-box .switch a{color:#7b9cff;text-decoration:none}
.auth-box .error{color:#ff6b8a;font-size:13px;text-align:center;margin-bottom:10px;display:none}
.auth-box .success{color:#69db7c;font-size:13px;text-align:center;margin-bottom:10px;display:none}
.main-content{display:none}
.header{background:rgba(10,15,35,0.5);backdrop-filter:blur(14px);border:1px solid rgba(120,160,255,0.08);color:#fff;padding:12px 18px;border-radius:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.header .menu-btn{background:0 0;border:none;color:rgba(255,255,255,0.5);font-size:24px;cursor:pointer;padding:0 8px}
.header .menu-btn:active{color:#fff}
.header h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,#a0baff,#7b9cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;flex:1;text-align:center}
.header .user-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.8);padding:4px 14px 4px 10px;border-radius:20px;font-size:13px;cursor:pointer}

/* ===== 脚本卡片 - 毛玻璃背景 ===== */
.script-card{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
    transition:all 0.3s ease;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
.script-card:active{
    transform:scale(0.98);
    background:rgba(255,255,255,0.08);
}
.script-card .script-img{
    width:50px;height:50px;border-radius:10px;overflow:hidden;flex-shrink:0;
    background:rgba(74,108,247,0.15);
    display:flex;align-items:center;justify-content:center;font-size:24px;
    cursor:pointer;transition:transform 0.2s;
    border:1px solid rgba(255,255,255,0.04);
}
.script-card .script-img:active{transform:scale(0.92)}
.script-card .script-img img{width:100%;height:100%;object-fit:cover}
.script-card .info{flex:1;min-width:0}
.script-card .info .name{font-size:14px;font-weight:500;color:#e8eeff}
.script-card .info .version{font-size:10px;color:rgba(180,200,255,0.3);margin-left:4px}
.script-card .info .desc{font-size:11px;color:rgba(180,200,255,0.4);margin-top:2px}
.script-card .btn-copy{
    background:rgba(74,108,247,0.2);
    border:1px solid rgba(74,108,247,0.15);
    color:#a0baff;
    padding:4px 14px;border-radius:20px;font-size:11px;cursor:pointer;flex-shrink:0;
    transition:all 0.2s;
}
.script-card .btn-copy:active{
    background:rgba(74,108,247,0.35);
    transform:scale(0.95);
}
.script-card .btn-copy.copied{
    background:rgba(69,199,119,0.2);
    border-color:rgba(69,199,119,0.2);
    color:#69db7c;
}

.profile-page{display:none}
.profile-page .profile-card{background:rgba(10,15,35,0.6);backdrop-filter:blur(16px);border-radius:20px;padding:30px 25px;box-shadow:0 8px 40px rgba(0,0,0,0.6);border:1px solid rgba(120,160,255,0.12);text-align:center}
.profile-page .profile-card .p-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,#4A6CF7,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;cursor:pointer;transition:transform 0.2s;box-shadow:0 4px 24px rgba(74,108,247,0.3)}
.profile-page .profile-card .p-avatar:active{transform:scale(0.95)}
.profile-page .profile-card .p-name{font-size:20px;font-weight:600;color:#fff}
.profile-page .profile-card .p-email{font-size:14px;color:rgba(180,200,255,0.5);margin-bottom:20px}
.profile-page .profile-card .p-info{text-align:left;background:rgba(255,255,255,0.04);border-radius:12px;padding:16px;margin-bottom:16px}
.profile-page .profile-card .p-info .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:14px}
.profile-page .profile-card .p-info .row:last-child{border-bottom:none}
.profile-page .profile-card .p-info .label{color:rgba(180,200,255,0.4)}
.profile-page .profile-card .p-info .value{color:rgba(255,255,255,0.8)}
.profile-page .profile-card .p-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.profile-page .profile-card .p-btns button{padding:10px 20px;border:none;border-radius:12px;font-size:14px;cursor:pointer}
.profile-page .profile-card .p-btns .btn-back{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7)}
.profile-page .profile-card .p-btns .btn-logout{background:#e74c5e;color:#fff}
.profile-page .profile-card .p-btns .btn-logs{background:rgba(74,108,247,0.2);color:#a0baff}

.logs-page{display:none}
.logs-page .logs-card{background:rgba(10,15,35,0.6);backdrop-filter:blur(16px);border-radius:20px;padding:30px 25px;box-shadow:0 8px 40px rgba(0,0,0,0.6);border:1px solid rgba(120,160,255,0.12)}
.logs-page .logs-card h2{color:#fff;font-size:20px;margin-bottom:4px}
.logs-page .logs-card .sub{color:rgba(180,200,255,0.3);font-size:12px;margin-bottom:16px}
.logs-page .logs-card .log-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;color:rgba(255,255,255,0.7)}
.logs-page .logs-card .log-item .log-time{color:rgba(180,200,255,0.3);font-size:11px}
.logs-page .logs-card .log-item .log-action{color:#e8eeff}
.logs-page .logs-card .log-empty{text-align:center;color:rgba(180,200,255,0.2);padding:40px 0}
.logs-page .logs-card .log-actions{display:flex;gap:12px;margin-top:16px}
.logs-page .logs-card .log-actions button{padding:8px 20px;border:none;border-radius:12px;font-size:13px;cursor:pointer}
.logs-page .logs-card .log-actions .btn-back-logs{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7)}
.logs-page .logs-card .log-actions .btn-clear-logs{background:rgba(231,76,94,0.15);color:#e74c5e}

.avatar-picker{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);z-index:1000;justify-content:center;align-items:center;padding:20px}

.toast.show{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.menu-overlay.show{display:block}

<script>
// ============================================================
// 粒子动画
// ============================================================
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let w, h;
let particles = [];
const PARTICLE_COUNT = 50;
const MAX_DIST = 140;
const FLOW_SPEED = 0.15;

function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight}
window.addEventListener('resize',resize);resize();

class Particle{
    constructor(){this.x=Math.random()*w;this.y=Math.random()*h;this.r=Math.random()*2+1;this.dx=(Math.random()-0.5)*FLOW_SPEED*0.6;this.dy=(Math.random()-0.5)*FLOW_SPEED*0.6;this.phaseX=Math.random()*100;this.phaseY=Math.random()*100;this.speed=0.2+Math.random()*0.3}
    update(t){const wx=Math.sin(t*0.0004+this.phaseX)*0.12,wy=Math.cos(t*0.0005+this.phaseY)*0.12;this.x+=this.dx+wx*this.speed;this.y+=this.dy+wy*this.speed;if(this.x<-20)this.x=w+20;if(this.x>w+20)this.x=-20;if(this.y<-20)this.y=h+20;if(this.y>h+20)this.y=-20}
    draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle='rgba(160,200,255,0.4)';ctx.fill()}
}
for(let i=0;i<PARTICLE_COUNT;i++)particles.push(new Particle());

function drawLines(t){for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<MAX_DIST){const a=(1-dist/MAX_DIST)*0.25;ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(120,160,255,${a})`;ctx.lineWidth=0.5;ctx.stroke()}}}}
function animate(t){ctx.clearRect(0,0,w,h);const g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w*0.6);g.addColorStop(0,'rgba(30,60,120,0.06)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(const p of particles)p.update(t);drawLines(t);for(const p of particles)p.draw();requestAnimationFrame(animate)}
animate(0);

function addLog(action, detail){
    const logs=JSON.parse(localStorage.getItem('userLogs')||'[]');
    logs.push({
        time:new Date().toLocaleString(),
        action:action,
        detail:detail||'',
        user:currentUser||'未登录'
    });
    if(logs.length>500)logs.splice(0,logs.length-500);
    localStorage.setItem('userLogs',JSON.stringify(logs));
}

function renderLogs(){
    const logs=JSON.parse(localStorage.getItem('userLogs')||'[]');
    const container=document.getElementById('logList');
    if(logs.length===0){
        container.innerHTML='<div class="log-empty">暂无操作记录</div>';
        return;
    }
    container.innerHTML=logs.slice().reverse().map(log=>
        `<div class="log-item">
            <span class="log-action">${log.action} ${log.detail?'- '+log.detail:''}</span>
            <span class="log-time">${log.time}</span>
        </div>`
    ).join('');
}

function clearLogs(){
    if(confirm('确定清空所有日志吗？')){

function copyScript(i){
    const s=SCRIPTS[i];
    const loader=s.loader;
    const btn=event.target;
    navigator.clipboard.writeText(loader).then(()=>{
        btn.textContent='✅ 已复制';
        btn.classList.add('copied');
        setTimeout(()=>{btn.textContent='📋 复制';btn.classList.remove('copied')},2000);
        showToast('✅ 已复制 '+s.name);
        addLog('📋 复制脚本',s.name);
    }).catch(()=>{
        const ta=document.createElement('textarea');
        ta.value=loader;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        btn.textContent='✅ 已复制';
        btn.classList.add('copied');
        setTimeout(()=>{btn.textContent='📋 复制';btn.classList.remove('copied')},2000);
        showToast('✅ 已复制 '+s.name);
        addLog('📋 复制脚本',s.name);
    });
}

let currentUser=null,isLogin=true;
function showError(msg){const el=document.getElementById('authError');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',4000)}
function showSuccess(msg){const el=document.getElementById('authSuccess');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',3000)}
function switchMode(){
    isLogin=!isLogin;
    document.getElementById('authBtn').textContent=isLogin?'登录':'注册';
    document.getElementById('switchText').textContent=isLogin?'还没有账号？':'已有账号？';
    document.getElementById('switchLink').textContent=isLogin?'注册':'登录';
    document.getElementById('modeText').textContent=isLogin?'登录后查看脚本':'注册后登录查看脚本';
    document.getElementById('authError').style.display='none';
    document.getElementById('authSuccess').style.display='none';
    document.getElementById('authEmail').value='';
    document.getElementById('authPassword').value='';
}

function loginRegister(){
    const email=document.getElementById('authEmail').value.trim();
    const password=document.getElementById('authPassword').value.trim();
    if(!email||!email.includes('@')||!email.includes('.')){showError('请输入正确的邮箱');return}
    if(password.length<6){showError('密码至少6位');return}
    let users={};try{users=JSON.parse(localStorage.getItem('users')||'{}')}catch(e){}
    if(isLogin){
        if(!users[email]){showError('账号不存在，请先注册');return}
        if(users[email]!==password){showError('密码错误');return}
        currentUser=email;
        addLog('✅ 登录成功',email);
        showMain();
        showToast('✅ 登录成功')
    }else{
        if(users[email]){showError('邮箱已注册');return}
        users[email]=password;localStorage.setItem('users',JSON.stringify(users));
        addLog('📝 注册成功',email);
        showSuccess('✅ 注册成功！请登录');
        setTimeout(()=>{switchMode();document.getElementById('authEmail').value=email;document.getElementById('authPassword').value='';showToast('✅ 请登录')},1500)
    }
}

function showMain(){
    document.getElementById('authSection').style.display='none';
    document.getElementById('mainSection').style.display='block';
    document.getElementById('profilePage').style.display='none';
    document.getElementById('logsPage').style.display='none';
    renderScripts();
    if(currentUser){
        const name=currentUser.split('@')[0];
        document.getElementById('userNameDisplay').textContent=name.length>6?name.substring(0,6)+'...':name;
    }
}

function showProfile(){
    document.getElementById('mainSection').style.display='none';
    document.getElementById('profilePage').style.display='block';
    document.getElementById('logsPage').style.display='none';
    if(currentUser){
        const name=currentUser.split('@')[0];
        document.getElementById('profileName').textContent=name;
        document.getElementById('profileEmail').textContent=currentUser;
        const uid='U'+currentUser.split('@')[0].substring(0,4).toUpperCase()+'01';
        document.getElementById('profileUid').textContent=uid;
        document.getElementById('profileRegTime').textContent=new Date().toLocaleString();
        // 头像
        const avatar=localStorage.getItem('avatar_'+currentUser)||'👤';
        document.getElementById('profileAvatar').textContent=avatar;
    }
}

function showLogs(){
    document.getElementById('profilePage').style.display='none';
    document.getElementById('logsPage').style.display='block';
    renderLogs();
}

function logout(){
    addLog('🚪 退出登录',currentUser||'');
    currentUser=null;
    document.getElementById('authSection').style.display='block';
    document.getElementById('mainSection').style.display='none';

    document.getElementById('logsPage').style.display='none';
