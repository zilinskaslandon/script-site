<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星脚本 · 星河</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#060b18;padding:20px;position:relative;overflow-x:hidden;transition:background .3s,color .3s}
body.light-mode{background:#eef0f5}
body.light-mode .auth-box,body.light-mode .profile-card{background:rgba(255,255,255,0.7);border-color:rgba(0,0,0,0.06)}
body.light-mode .auth-box h2,body.light-mode .profile-card .p-name,body.light-mode .header h1{color:#1a1a2e}
body.light-mode .auth-box .sub,body.light-mode .profile-card .p-email,body.light-mode .profile-card .p-info .label{color:rgba(0,0,0,0.4)}
body.light-mode .auth-box input{background:rgba(255,255,255,0.5);color:#1a1a2e;border-color:rgba(0,0,0,0.1)}
body.light-mode .auth-box input::placeholder{color:rgba(0,0,0,0.3)}
body.light-mode .script-card{background:rgba(255,255,255,0.5);border-color:rgba(0,0,0,0.06)}
body.light-mode .script-card .info .name{color:#1a1a2e}
body.light-mode .script-card .info .desc{color:rgba(0,0,0,0.4)}
body.light-mode .header{background:rgba(255,255,255,0.5);border-color:rgba(0,0,0,0.06)}
body.light-mode .header h1{background:linear-gradient(135deg,#4A6CF7,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
body.light-mode .header .user-btn{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.06);color:rgba(0,0,0,0.6)}
body.light-mode .footer{color:rgba(0,0,0,0.2)}
body.light-mode .music-btn{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.06);color:rgba(0,0,0,0.4)}
body.light-mode .music-btn.playing{color:#4A6CF7}
body.light-mode #announcementBar{background:rgba(74,108,247,0.06);border-color:rgba(74,108,247,0.08)}
body.light-mode #announcementBar .announce-text{color:#1a1a2e}
body.light-mode #announcementBar .announce-time{color:rgba(0,0,0,0.3)}
body.light-mode #announcementBar .announce-close{color:rgba(0,0,0,0.2)}
body.light-mode .search-input{background:rgba(255,255,255,0.5);color:#1a1a2e;border-color:rgba(0,0,0,0.06)}
body.light-mode .search-input::placeholder{color:rgba(0,0,0,0.3)}
body.light-mode .toolbar-btn{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.06);color:rgba(0,0,0,0.6)}
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.container{max-width:600px;width:100%;position:relative;z-index:1}
.auth-box{background:rgba(10,15,35,0.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;padding:30px 25px;box-shadow:0 8px 40px rgba(0,0,0,0.6);border:1px solid rgba(120,160,255,0.12);transition:background .3s,border-color .3s}
.auth-box h2{text-align:center;font-size:24px;margin-bottom:4px;color:#fff;font-weight:600;letter-spacing:1px}
.auth-box .sub{text-align:center;color:rgba(180,200,255,0.5);font-size:14px;margin-bottom:22px;letter-spacing:.5px}
.auth-box input{width:100%;padding:13px 16px;border:1px solid rgba(120,160,255,0.15);border-radius:12px;font-size:15px;margin-bottom:12px;background:rgba(255,255,255,0.04);color:#e8eeff;outline:none;transition:border-color .3s,background .3s}
.auth-box input::placeholder{color:rgba(180,200,255,0.25)}
.auth-box input:focus{border-color:#5b7cfa;background:rgba(255,255,255,0.07)}
.auth-box .btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,#4A6CF7,#8b5cf6);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .2s;box-shadow:0 4px 20px rgba(74,108,247,0.25)}
.auth-box .btn-primary:active{transform:scale(.96);box-shadow:0 2px 12px rgba(74,108,247,0.15)}
.auth-box .switch{text-align:center;margin-top:16px;font-size:14px;color:rgba(180,200,255,0.4)}
.auth-box .switch a{color:#7b9cff;text-decoration:none;font-weight:500;transition:color .2s}
.auth-box .switch a:active{color:#4A6CF7}
.auth-box .error{color:#ff6b8a;font-size:13px;text-align:center;margin-bottom:10px;display:none}
.auth-box .success{color:#69db7c;font-size:13px;text-align:center;margin-bottom:10px;display:none}
.main-content{display:none}
.header{background:rgba(10,15,35,0.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(120,160,255,0.08);color:#fff;padding:12px 18px;border-radius:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;transition:background .3s,border-color .3s}
.header h1{font-size:18px;font-weight:600;letter-spacing:.5px;background:linear-gradient(135deg,#a0baff,#7b9cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.header .right-area{display:flex;align-items:center;gap:8px}
.header .user-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.8);padding:4px 14px 4px 10px;border-radius:20px;font-size:13px;cursor:pointer;transition:background .2s}
.header .user-btn:active{background:rgba(255,255,255,0.12)}
.header .user-btn .avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#4A6CF7,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:600;overflow:hidden;flex-shrink:0}
.header .user-btn .avatar img{width:100%;height:100%;object-fit:cover}
.music-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s;flex-shrink:0}
.music-btn:active{background:rgba(255,255,255,0.12);color:#fff}
.music-btn.playing{color:#4A6CF7;border-color:rgba(74,108,247,0.3)}
.music-popup{display:none;position:fixed;top:80px;right:16px;width:260px;background:rgba(10,15,35,0.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;padding:20px;border:1px solid rgba(120,160,255,0.08);box-shadow:0 20px 60px rgba(0,0,0,0.6);z-index:200}
.music-popup.show{display:block}
.music-popup .popup-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.music-popup .popup-header .title{color:rgba(255,255,255,0.5);font-size:13px}
.music-popup .popup-header .close-btn{background:0 0;border:none;color:rgba(255,255,255,0.3);font-size:18px;cursor:pointer;padding:0 4px}
.music-popup .popup-header .close-btn:active{color:rgba(255,255,255,0.6)}
.music-popup .song-info{text-align:center;margin-bottom:14px}
.music-popup .song-info .s-title{color:#fff;font-size:15px;font-weight:500}
.music-popup .song-info .s-artist{color:rgba(180,200,255,0.3);font-size:12px;margin-top:2px}
.music-popup .controls{display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:14px}
.music-popup .controls .ctrl-btn{background:rgba(255,255,255,0.06);border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:16px;color:rgba(255,255,255,0.6);cursor:pointer;transition:background .2s}
.music-popup .controls .ctrl-btn:active{background:rgba(255,255,255,0.12)}
.music-popup .controls .ctrl-btn.play-btn{background:rgba(74,108,247,0.2);color:#4A6CF7;font-size:18px}
.music-popup .controls .ctrl-btn.play-btn:active{background:rgba(74,108,247,0.35)}
.music-popup .volume-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.music-popup .volume-row .v-icon{color:rgba(255,255,255,0.25);font-size:14px}
.music-popup .volume-row input[type=range]{flex:1;height:3px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.1);border-radius:2px;outline:none}
.music-popup .volume-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:#4A6CF7;cursor:pointer}
#announcementBar{background:rgba(74,108,247,0.06);border:1px solid rgba(74,108,247,0.08);border-radius:12px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;transition:all .3s;cursor:pointer}
#announcementBar .announce-icon{font-size:16px;flex-shrink:0}
#announcementBar .announce-content{flex:1;overflow:hidden;min-width:0}
#announcementBar .announce-content .text{font-size:13px;color:#e8eeff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#announcementBar .announce-content .time{font-size:10px;color:rgba(180,200,255,0.25)}
#announcementBar .announce-nav{display:flex;gap:4px;flex-shrink:0}
#announcementBar .announce-nav button{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.04);color:rgba(255,255,255,0.3);border-radius:4px;padding:2px 8px;font-size:14px;cursor:pointer}
#announcementBar .announce-nav button:active{background:rgba(255,255,255,0.08)}
#announcementBar .announce-dot{font-size:11px;color:rgba(180,200,255,0.2);align-self:center;min-width:28px;text-align:center}
#announcementBar .announce-close{background:0 0;border:none;color:rgba(255,255,255,0.15);font-size:14px;cursor:pointer;padding:0 2px}
#announcementBar .announce-close:active{color:rgba(255,255,255,0.4)}
.script-card{background:rgba(255,255,255,0.04);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(120,160,255,0.06);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;transition:background .2s,border-color .2s}
.script-card:active{background:rgba(255,255,255,0.07)}
.script-card .info{flex:1;min-width:0}
.script-card .info .name{font-size:15px;font-weight:500;color:#e8eeff}
.script-card .info .version{font-size:11px;color:rgba(180,200,255,0.3);margin-left:6px}
.script-card .info .desc{font-size:12px;color:rgba(180,200,255,0.4);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.script-card .info .pin-btn{cursor:pointer;margin-left:6px;font-size:14px;background:0 0;border:none;color:rgba(180,200,255,0.2)}
.script-card .info .pin-btn.pinned{color:#f7c948}
.script-card .info .pin-btn:active{transform:scale(.8)}
.btn-copy{background:rgba(74,108,247,0.15);border:1px solid rgba(74,108,247,0.12);color:#a0baff;padding:5px 16px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;transition:background .2s,border-color .2s;flex-shrink:0;margin-left:10px}
.btn-copy:active{background:rgba(74,108,247,0.25)}
.btn-copy.copied{background:rgba(69,199,119,0.15);border-color:rgba(69,199,119,0.15);color:#69db7c}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.toolbar .search-input{flex:1;min-width:120px;padding:7px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);color:#e8eeff;font-size:13px;outline:none;transition:border-color .2s}
.toolbar .search-input:focus{border-color:rgba(74,108,247,0.3)}
.toolbar .search-input::placeholder{color:rgba(180,200,255,0.2)}
.toolbar .toolbar-btn{padding:6px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.03);color:rgba(180,200,255,0.4);font-size:12px;cursor:pointer;transition:all .2s;white-space:nowrap}
.toolbar .toolbar-btn:active{background:rgba(255,255,255,0.06)}
.stats-bar{display:flex;justify-content:space-between;font-size:11px;color:rgba(180,200,255,0.2);margin-bottom:10px;padding:0 2px}
.footer{text-align:center;color:rgba(180,200,255,0.08);font-size:11px;margin-top:24px;letter-spacing:.5px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(10,15,35,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(120,160,255,0.08);color:#e8eeff;padding:10px 24px;border-radius:30px;font-size:13px;display:none;z-index:999;white-space:nowrap}
.toast.show{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.profile-page{display:none}
.profile-page .profile-card{background:rgba(10,15,35,0.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;padding:30px 25px;box-shadow:0 8px 40px rgba(0,0,0,0.6);border:1px solid rgba(120,160,255,0.12);text-align:center;transition:background .3s,border-color .3s}
.profile-page .profile-card .big-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#4A6CF7,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;font-weight:600;margin:0 auto 16px;box-shadow:0 4px 24px rgba(74,108,247,0.3);cursor:pointer;overflow:hidden;transition:transform .2s,box-shadow .2s;position:relative}
.profile-page .profile-card .big-avatar:active{transform:scale(.95)}
.profile-page .profile-card .big-avatar img{width:100%;height:100%;object-fit:cover}
.profile-page .profile-card .big-avatar .camera-icon{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);color:#fff;font-size:12px;padding:4px 0;opacity:0;transition:opacity .3s}
.profile-page .profile-card .big-avatar:active .camera-icon{opacity:1}
.profile-page .profile-card .avatar-hint{font-size:12px;color:rgba(180,200,255,0.3);margin-top:-10px;margin-bottom:16px}
.profile-page .profile-card .p-name{font-size:20px;font-weight:600;color:#fff;margin-bottom:4px}
.profile-page .profile-card .p-email{font-size:14px;color:rgba(180,200,255,0.5);margin-bottom:20px}
.profile-page .profile-card .p-info{text-align:left;background:rgba(255,255,255,0.04);border-radius:12px;padding:16px;margin-bottom:16px}
.profile-page .profile-card .p-info .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:14px}
.profile-page .profile-card .p-info .row:last-child{border-bottom:none}
.profile-page .profile-card .p-info .label{color:rgba(180,200,255,0.4)}
.profile-page .profile-card .p-info .value{color:rgba(255,255,255,0.8)}
.profile-page .profile-card .p-btns{display:flex;gap:12px;justify-content:center}
.profile-page .profile-card .p-btns button{padding:10px 28px;border:none;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;transition:transform .12s}
.profile-page .profile-card .p-btns button:active{transform:scale(.96)}
.profile-page .profile-card .p-btns .btn-back{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7)}
.profile-page .profile-card .p-btns .btn-logout{background:#e74c5e;color:#fff}
.profile-page .profile-card .p-btns .btn-logout:active{background:#c0392b}
.avatar-picker{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);z-index:1000;justify-content:center;align-items:center;padding:20px}
.avatar-picker.show{display:flex}
.avatar-picker .picker-box{background:rgba(10,15,35,0.92);border-radius:20px;padding:24px 20px;max-width:400px;width:100%;border:1px solid rgba(120,160,255,0.1)}
.avatar-picker .picker-box h3{color:#fff;text-align:center;margin-bottom:16px;font-size:18px}
.avatar-picker .picker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.avatar-picker .picker-grid .opt{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s,border-color .2s;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;font-weight:600}
.avatar-picker .picker-grid .opt:active{transform:scale(.9)}
.avatar-picker .picker-grid .opt.active{border-color:#4A6CF7;box-shadow:0 0 20px rgba(74,108,247,0.3)}
.avatar-picker .picker-footer{display:flex;gap:12px}
.avatar-picker .picker-footer button{flex:1;padding:10px;border:none;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;transition:transform .12s}
.avatar-picker .picker-footer button:active{transform:scale(.96)}
.avatar-picker .picker-footer .btn-close{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6)}
.avatar-picker .picker-footer .btn-upload{background:linear-gradient(135deg,#4A6CF7,#8b5cf6);color:#fff}
.hidden{display:none!important}
.announce-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);z-index:300;justify-content:center;align-items:center;padding:30px 20px}
.announce-modal.show{display:flex}
.announce-modal .modal-box{background:rgba(10,15,35,0.95);border-radius:20px;padding:24px 20px;max-width:500px;width:100%;border:1px solid rgba(120,160,255,0.08);max-height:80vh;overflow-y:auto}
.announce-modal .modal-box .modal-title{color:#fff;font-size:18px;font-weight:600;margin-bottom:4px}
.announce-modal .modal-box .modal-time{color:rgba(180,200,255,0.25);font-size:12px;margin-bottom:12px}
.announce-modal .modal-box .modal-body{color:rgba(255,255,255,0.8);font-size:14px;line-height:1.8;white-space:pre-wrap}
.announce-modal .modal-box .modal-close{margin-top:16px;padding:8px 24px;background:rgba(74,108,247,0.15);border:1px solid rgba(74,108,247,0.1);color:#a0baff;border-radius:12px;font-size:14px;cursor:pointer;width:100%}
.announce-modal .modal-box .modal-close:active{background:rgba(74,108,247,0.25)}
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="container">
    <!-- ===== 顶部状态栏 ===== -->
    <div id="statusBar" style="display:flex;justify-content:space-between;align-items:center;padding:5px 10px;margin-bottom:10px;background:rgba(255,255,255,0.02);border-radius:10px;border:1px solid rgba(255,255,255,0.03);font-size:11px;color:rgba(180,200,255,0.3);flex-wrap:wrap;gap:4px;">
        <span id="greetingText">🌅 早上好</span>
        <span id="statusText">🟢 在线</span>
        <span id="visitCount">👁️ 0次</span>
        <button id="themeToggle" style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);color:rgba(180,200,255,0.3);border-radius:12px;padding:1px 10px;font-size:11px;cursor:pointer;">🌓 切换</button>
    </div>

    <!-- ===== 公告栏 ===== -->
    <div id="announcementBar">
        <span class="announce-icon">📢</span>
        <div class="announce-content" id="announceContent">
            <div class="text" id="announceText">加载中...</div>
            <div class="time" id="announceTime"></div>
        </div>
        <div class="announce-nav">
            <button id="announcePrev">‹</button>
            <span class="announce-dot" id="announceDot">1/3</span>
            <button id="announceNext">›</button>
        </div>
        <button class="announce-close" id="announceClose">✕</button>
    </div>

    <!-- ===== 公告详情弹窗 ===== -->
    <div class="announce-modal" id="announceModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">公告标题</div>
            <div class="modal-time" id="modalTime">2026-08-02</div>
            <div class="modal-body" id="modalBody">公告内容详情</div>
            <button class="modal-close" id="modalClose">我知道了</button>
        </div>
    </div>

    <!-- ===== 登录界面 ===== -->
    <div id="authSection" class="auth-box">
        <h2>✦ 星脚本</h2>
        <p class="sub" id="modeText">登录后查看脚本</p>
        <div id="authError" class="error"></div>
        <div id="authSuccess" class="success"></div>
        <input type="email" id="authEmail" placeholder="邮箱地址" autocomplete="email">
        <input type="password" id="authPassword" placeholder="密码（至少6位）" autocomplete="current-password">
        <button class="btn-primary" id="authBtn">登录</button>
        <div class="switch"><span id="switchText">还没有账号？</span> <a href="#" id="switchLink">注册</a></div>
    </div>

    <!-- ===== 主界面 ===== -->
    <div id="mainSection" class="main-content">
        <div class="header">
            <h1 id="homeBtn">✦ 星脚本</h1>
            <div class="right-area">
                <button class="music-btn" id="musicBtn">🎵</button>
                <button class="user-btn" id="profileBtn">
                    <span class="avatar" id="headerAvatar">✦</span>

// ============================================================
// 流动粒子动画（不变）
// ============================================================
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let w, h;
let particles = [];
const PARTICLE_COUNT = 50;
const MAX_DIST = 140;
const FLOW_SPEED = 0.15;

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
    constructor() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.r = Math.random() * 2 + 1;
        this.dx = (Math.random() - 0.5) * FLOW_SPEED * 0.6;
        this.dy = (Math.random() - 0.5) * FLOW_SPEED * 0.6;
        this.phaseX = Math.random() * 100;
        this.phaseY = Math.random() * 100;
        this.speed = 0.2 + Math.random() * 0.3;
    }
    update(time) {
        const waveX = Math.sin(time * 0.0004 + this.phaseX) * 0.12;
        const waveY = Math.cos(time * 0.0005 + this.phaseY) * 0.12;
        this.x += this.dx + waveX * this.speed;
        this.y += this.dy + waveY * this.speed;
        if (this.x < -20) this.x = w + 20;
        if (this.x > w + 20) this.x = -20;
        if (this.y < -20) this.y = h + 20;
        if (this.y > h + 20) this.y = -20;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(160, 200, 255, 0.4)';
        ctx.fill();
    }
}

for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new Particle());
}

function drawLines(time) {
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < MAX_DIST) {
                const alpha = (1 - dist / MAX_DIST) * 0.25;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(120, 160, 255, ${alpha})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }
    }
}

function animate(time) {
    ctx.clearRect(0, 0, w, h);
    const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w*0.6);
    grad.addColorStop(0, 'rgba(30, 60, 120, 0.06)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    for (const p of particles) {
        p.update(time);
    }
    drawLines(time);
    for (const p of particles) {
        p.draw();
    }
    requestAnimationFrame(animate);
}
animate(0);

const SCRIPTS = [

];

const scriptList = document.getElementById('scriptList');

function getPinned() {
    try { return JSON.parse(localStorage.getItem('pinnedScripts') || '{}'); } catch(e) { return {}; }
}

function togglePin(id) {
    const p = getPinned();
    p[id] = !p[id];
    localStorage.setItem('pinnedScripts', JSON.stringify(p));
    renderScripts();
}

function renderScripts() {
    const pinned = getPinned();
    const keyword = searchInput.value.toLowerCase().trim();
    const sorted = [...SCRIPTS].sort((a, b) => {
        const aId = a.name + a.version;
        const bId = b.name + b.version;
        return (pinned[bId] || 0) - (pinned[aId] || 0);
    });
    let html = '';
    let visible = 0;
    sorted.forEach(s => {
        const id = s.name + s.version;
        const match = s.name.toLowerCase().includes(keyword) || s.desc.toLowerCase().includes(keyword);
        if (!match) return;
        visible++;
        html += `<div class="script-card" data-id="${id}">
            <div class="info">
                <div class="name">${s.name} <span class="version">v${s.version}</span>
                    <button class="pin-btn ${pinned[id] ? 'pinned' : ''}" onclick="togglePin('${id}')">${pinned[id] ? '⭐' : '☆'}</button>
                </div>
                <div class="desc">${s.desc || ''}</div>
            </div>
            <button class="btn-copy" onclick="copyScript('${id}')">📋 复制</button>
        </div>`;
    });
    scriptList.innerHTML = html || '<div style="text-align:center;padding:40px 0;color:rgba(180,200,255,0.2);font-size:14px;">🔍 没有找到匹配的脚本</div>';
    statsText.textContent = `📊 共 ${SCRIPTS.length} 个脚本，显示 ${visible} 个`;
}

function copyScript(id) {
    const s = SCRIPTS.find(item => item.name + item.version === id);
    if (!s) return;
    navigator.clipboard.writeText(s.loader).then(() => {
        showToast('✅ 已复制！');
    }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = s.loader;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('✅ 已复制！');
    });
}

searchInput.addEventListener('input', renderScripts);
document.getElementById('copyAllBtn')?.addEventListener('click', function() {
    const all = SCRIPTS.map(s => s.loader).join('\n\n');
    navigator.clipboard.writeText(all).then(() => {
        showToast('✅ 已复制全部 ' + SCRIPTS.length + ' 个脚本！');
    }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = all;

        ta.select();

function isValidEmail(email) {
    if (!email) return false;
    if (!email.includes('@') || !email.includes('.')) return false;
    if (email.indexOf('@') > email.lastIndexOf('.')) return false;
    if (email.indexOf('@') === 0 || email.indexOf('@') === email.length - 1) return false;
    if (email.lastIndexOf('.') === email.length - 1) return false;
    if (email.includes(' ')) return false;
    return true;
}

function isValidPassword(password) {
    return password && password.length >= 6;
}

function getInitials(email) {
    if (!email) return '✦';
    const name = email.split('@')[0];
    if (name.length <= 2) return name.toUpperCase();
    return name.substring(0, 2).toUpperCase();
}

    const users = JSON.parse(localStorage.getItem('users') || '{}');
    if (users[email] && users[email]._avatar) return users[email]._avatar;
    return null;
}

    const users = JSON.parse(localStorage.getItem('users') || '{}');
    if (users[email]) {
        if (typeof users[email] === 'string') {
            users[email] = { password: users[email], _avatar: avatarData, _time: users[email + '._time'] || new Date().toISOString() };

            users[email]._avatar = avatarData;

    localStorage.setItem('users', JSON.stringify(users));
}

    ).join('');
    avatarGrid.querySelectorAll('.opt').forEach(el => {
        el.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index);
            const avatar = DEFAULT_AVATARS[idx];
            setAvatarData(currentUser, { type: 'emoji', data: avatar.emoji, bg: avatar.bg });
            updateAllAvatars();
            closePicker();
            showToast('✅ 头像已更换');
        });
    });
}

function openPicker() {
    if (!currentUser) { showToast('请先登录'); return; }
    renderAvatarPicker();
    avatarPicker.classList.add('show');
}

function closePicker() {
    avatarPicker.classList.remove('show');
}

function updateAllAvatars() {
    if (!currentUser) return;
    applyAvatar(currentUser, profileAvatar, avatarEmoji, avatarImage);
    const avatarData = getAvatarData(currentUser);
    if (avatarData && avatarData.type === 'emoji') {
        headerAvatar.innerHTML = '';
        headerAvatar.textContent = avatarData.data;
        headerAvatar.style.background = avatarData.bg || 'linear-gradient(135deg,#4A6CF7,#8b5cf6)';
    } else if (avatarData && avatarData.type === 'image') {
        headerAvatar.innerHTML = `<img src="${avatarData.data}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
        headerAvatar.style.background = 'transparent';
    } else {
        headerAvatar.innerHTML = '';
        headerAvatar.textContent = getInitials(currentUser);
        headerAvatar.style.background = 'linear-gradient(135deg,#4A6CF7,#8b5cf6)';
    }
}

function showMain() {
    authSection.style.display = 'none';
    mainSection.style.display = 'block';
    profilePage.style.display = 'none';
    renderScripts();
    if (currentUser) {
        const displayName = currentUser.split('@')[0];
        userNameDisplay.textContent = displayName.length > 8 ? displayName.substring(0, 8) + '...' : displayName;
        updateAllAvatars();
    }
}

function showProfile() {
    mainSection.style.display = 'none';
    profilePage.style.display = 'block';
    if (currentUser) {
        const displayName = currentUser.split('@')[0];
        profileName.textContent = displayName;
        profileEmail.textContent = currentUser;
        applyAvatar(currentUser, profileAvatar, avatarEmoji, avatarImage);

        const users = JSON.parse(localStorage.getItem('users') || '{}');
        let userData = users[currentUser];

        if (userData && typeof userData === 'object') {
            if (!userData._uid) {
                const emailPrefix = currentUser.split('@')[0].substring(0, 4).toUpperCase();
                const randomNum = String(Math.floor(Math.random() * 100)).padStart(2, '0');
                userData._uid = 'U' + emailPrefix + randomNum;
                users[currentUser] = userData;
                localStorage.setItem('users', JSON.stringify(users));
            }
            profileUid.textContent = userData._uid || 'U----';
        } else {
            profileUid.textContent = 'U----';
        }

        if (userData && typeof userData === 'object' && userData._time) {
            profileRegTime.textContent = new Date(userData._time).toLocaleString();
        } else {
            profileRegTime.textContent = '今天';
        }
    }
}

// ===== 退出登录函数 =====
function logout() {
    currentUser = null;
    authSection.style.display = 'block';
    mainSection.style.display = 'none';
    profilePage.style.display = 'none';
    showToast('✅ 已退出');
}

function switchMode() {
    isLoginMode = !isLoginMode;
    authBtn.textContent = isLoginMode ? '登录' : '注册';
    switchText.textContent = isLoginMode ? '还没有账号？' : '已有账号？';
    switchLink.textContent = isLoginMode ? '注册' : '登录';
    modeText.textContent = isLoginMode ? '登录后查看脚本' : '注册后登录查看脚本';
    authError.style.display = 'none';
    authSuccess.style.display = 'none';
    authEmail.value = '';
    authPassword.value = '';
}

// ============================================================
// 所有事件绑定（修复）
// ============================================================
authBtn.onclick = function() {
    const email = authEmail.value.trim();
    const password = authPassword.value.trim();

    if (!isValidEmail(email)) { showError('❌ 请输入正确的邮箱（如 123@qq.com）'); return; }
    if (!isValidPassword(password)) { showError('❌ 密码至少 6 位'); return; }

    let users = {};
    try { users = JSON.parse(localStorage.getItem('users') || '{}'); } catch(e) { users = {}; }

    if (isLoginMode) {
        if (users[email] === undefined || (typeof users[email] === 'object' && !users[email].password)) {
            showError('❌ 账号不存在，请先注册');
            return;
        }
        const storedPw = typeof users[email] === 'string' ? users[email] : users[email].password;
        if (storedPw !== password) { showError('❌ 密码错误，请重试'); return; }
        currentUser = email;
        showMain();
        showToast('✅ 登录成功！');
    } else {
        if (users[email] !== undefined) { showError('❌ 该邮箱已注册，请直接登录'); return; }
        const emailPrefix = email.split('@')[0].substring(0, 4).toUpperCase();
        const randomNum = String(Math.floor(Math.random() * 100)).padStart(2, '0');
        const uid = 'U' + emailPrefix + randomNum;

        users[email] = { password: password, _time: new Date().toISOString(), _avatar: null, _uid: uid };
        localStorage.setItem('users', JSON.stringify(users));
        showSuccess('✅ 注册成功！即将切换到登录...');
        setTimeout(() => {
            switchMode();
            authEmail.value = email;
            authPassword.value = '';
            showToast('✅ 请登录');
        }, 1500);
    }
};

switchLink.onclick = function(e) { e.preventDefault();
    switchMode(); };

// ===== 修复：退出登录 =====
logoutBtn.onclick = function(e) {
    e.stopPropagation();
    logout();
};

profileLogoutBtn.onclick = function(e) {
    e.stopPropagation();
    logout();
};

// ===== 修复：个人主页点不进去 =====
profileBtn.onclick = function(e) {
    e.stopPropagation();
    if (!currentUser) {
        showToast('请先登录');
        return;
    }
    showProfile();
};

profileBackBtn.onclick = function(e) {
    e.stopPropagation();
    showMain();
};

homeBtn.onclick = function(e) {
    e.stopPropagation();
    if (currentUser) {
        showMain();
    }
};

profileAvatar.onclick = function(e) {
    e.stopPropagation();
    openPicker();
};

pickerClose.onclick = closePicker;
avatarPicker.addEventListener('click', function(e) { if (e.target === this) closePicker(); });
pickerUpload.onclick = function() { fileInput.click(); };
fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const dataUrl = ev.target.result;
        setAvatarData(currentUser, { type: 'image', data: dataUrl });
        updateAllAvatars();
        closePicker();
        showToast('✅ 头像已上传');
        fileInput.value = '';
    };
    reader.readAsDataURL(file);
});

authEmail.addEventListener('keydown', function(e) { if (e.key === 'Enter') authBtn.click(); });
authPassword.addEventListener('keydown', function(e) { if (e.key === 'Enter') authBtn.click(); });

function checkSession() {
    authSection.style.display = 'block';
    mainSection.style.display = 'none';
    profilePage.style.display = 'none';
}
checkSession();
</script>
</body>
</html>
