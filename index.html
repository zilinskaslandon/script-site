<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星脚本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#060b18;padding:20px;position:relative;overflow-x:hidden}
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.container{max-width:600px;width:100%;position:relative;z-index:1}
.auth-box{background:rgba(10,15,35,0.6);backdrop-filter:blur(16px);border-radius:20px;padding:30px 25px;box-shadow:0 8px 40px rgba(0,0,0,0.6);border:1px solid rgba(120,160,255,0.12)}
.auth-box h2{text-align:center;font-size:24px;color:#fff;font-weight:600}
.auth-box .sub{text-align:center;color:rgba(180,200,255,0.5);font-size:14px;margin-bottom:20px}
.auth-box input{width:100%;padding:13px 16px;border:1px solid rgba(120,160,255,0.15);border-radius:12px;font-size:15px;margin-bottom:12px;background:rgba(255,255,255,0.04);color:#e8eeff;outline:none}
.auth-box input::placeholder{color:rgba(180,200,255,0.25)}
.auth-box .btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,#4A6CF7,#8b5cf6);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.auth-box .switch{text-align:center;margin-top:16px;font-size:14px;color:rgba(180,200,255,0.4)}
.auth-box .switch a{color:#7b9cff;text-decoration:none}
.auth-box .error{color:#ff6b8a;font-size:13px;text-align:center;margin-bottom:10px;display:none}
.auth-box .success{color:#69db7c;font-size:13px;text-align:center;margin-bottom:10px;display:none}
.main-content{display:none}
.header{background:rgba(10,15,35,0.5);backdrop-filter:blur(14px);border:1px solid rgba(120,160,255,0.08);color:#fff;padding:12px 18px;border-radius:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,#a0baff,#7b9cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.header .user-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.8);padding:4px 14px 4px 10px;border-radius:20px;font-size:13px;cursor:pointer}
.script-card{background:rgba(255,255,255,0.04);border:1px solid rgba(120,160,255,0.06);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.script-card .info .name{font-size:15px;font-weight:500;color:#e8eeff}
.script-card .info .version{font-size:11px;color:rgba(180,200,255,0.3);margin-left:6px}
.script-card .info .desc{font-size:12px;color:rgba(180,200,255,0.4);margin-top:2px}
.btn-copy{background:rgba(74,108,247,0.15);border:1px solid rgba(74,108,247,0.12);color:#a0baff;padding:5px 16px;border-radius:20px;font-size:12px;cursor:pointer}
.profile-page{display:none}
.profile-page .profile-card{background:rgba(10,15,35,0.6);backdrop-filter:blur(16px);border-radius:20px;padding:30px 25px;box-shadow:0 8px 40px rgba(0,0,0,0.6);border:1px solid rgba(120,160,255,0.12);text-align:center}
.profile-page .profile-card .p-name{font-size:20px;font-weight:600;color:#fff}
.profile-page .profile-card .p-email{font-size:14px;color:rgba(180,200,255,0.5);margin-bottom:20px}
.profile-page .profile-card .p-info{text-align:left;background:rgba(255,255,255,0.04);border-radius:12px;padding:16px;margin-bottom:16px}
.profile-page .profile-card .p-info .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:14px}
.profile-page .profile-card .p-info .row:last-child{border-bottom:none}
.profile-page .profile-card .p-info .label{color:rgba(180,200,255,0.4)}
.profile-page .profile-card .p-info .value{color:rgba(255,255,255,0.8)}
.profile-page .profile-card .p-btns{display:flex;gap:12px;justify-content:center}
.profile-page .profile-card .p-btns button{padding:10px 28px;border:none;border-radius:12px;font-size:14px;cursor:pointer}
.profile-page .profile-card .p-btns .btn-back{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7)}
.profile-page .profile-card .p-btns .btn-logout{background:#e74c5e;color:#fff}
.avatar-picker{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);z-index:1000;justify-content:center;align-items:center;padding:20px}
.avatar-picker.show{display:flex}
.avatar-picker .picker-box{background:rgba(10,15,35,0.92);border-radius:20px;padding:24px 20px;max-width:400px;width:100%;border:1px solid rgba(120,160,255,0.1)}
.avatar-picker .picker-box h3{color:#fff;text-align:center;margin-bottom:16px;font-size:18px}
.avatar-picker .picker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.avatar-picker .picker-grid .opt{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px}
.avatar-picker .picker-grid .opt.active{border-color:#4A6CF7;box-shadow:0 0 20px rgba(74,108,247,0.3)}
.avatar-picker .picker-footer{display:flex;gap:12px}
.avatar-picker .picker-footer button{flex:1;padding:10px;border:none;border-radius:12px;font-size:14px;cursor:pointer}
.avatar-picker .picker-footer .btn-close{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6)}
.avatar-picker .picker-footer .btn-upload{background:linear-gradient(135deg,#4A6CF7,#8b5cf6);color:#fff}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(10,15,35,0.85);backdrop-filter:blur(12px);border:1px solid rgba(120,160,255,0.08);color:#e8eeff;padding:10px 24px;border-radius:30px;font-size:13px;display:none;z-index:999;white-space:nowrap}
.toast.show{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.footer{text-align:center;color:rgba(180,200,255,0.08);font-size:11px;margin-top:24px}
.announce-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);z-index:300;justify-content:center;align-items:center;padding:30px 20px}
.announce-modal.show{display:flex}
.announce-modal .modal-box{background:rgba(10,15,35,0.95);border-radius:20px;padding:24px 20px;max-width:500px;width:100%;border:1px solid rgba(120,160,255,0.08);max-height:80vh;overflow-y:auto}
.announce-modal .modal-box .modal-title{color:#fff;font-size:18px;font-weight:600}
.announce-modal .modal-box .modal-time{color:rgba(180,200,255,0.25);font-size:12px;margin-bottom:12px}
.announce-modal .modal-box .modal-body{color:rgba(255,255,255,0.8);font-size:14px;line-height:1.8}
.announce-modal .modal-box .modal-close{margin-top:16px;padding:8px 24px;background:rgba(74,108,247,0.15);border:1px solid rgba(74,108,247,0.1);color:#a0baff;border-radius:12px;font-size:14px;cursor:pointer;width:100%}
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="container">
    <!-- 公告栏 -->
    <div id="announcementBar" style="background:rgba(74,108,247,0.06);border:1px solid rgba(74,108,247,0.08);border-radius:12px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;cursor:pointer;">
        <span style="font-size:16px;">📢</span>
        <div style="flex:1;overflow:hidden;">
            <div style="font-size:13px;color:#e8eeff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="announceText">加载中...</div>
            <div style="font-size:10px;color:rgba(180,200,255,0.25);" id="announceTime"></div>
        </div>
        <div style="display:flex;gap:4px;">
            <button id="announcePrev" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.04);color:rgba(255,255,255,0.3);border-radius:4px;padding:2px 8px;font-size:14px;cursor:pointer;">‹</button>
            <span style="font-size:11px;color:rgba(180,200,255,0.2);align-self:center;min-width:28px;text-align:center;" id="announceDot">1/3</span>
            <button id="announceNext" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.04);color:rgba(255,255,255,0.3);border-radius:4px;padding:2px 8px;font-size:14px;cursor:pointer;">›</button>
        </div>
        <button id="announceClose" style="background:0 0;border:none;color:rgba(255,255,255,0.15);font-size:14px;cursor:pointer;padding:0 2px;">✕</button>
    </div>

    <!-- 公告弹窗 -->
    <div id="announceModal" class="announce-modal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">公告</div>
            <div class="modal-time" id="modalTime"></div>
            <div class="modal-body" id="modalBody"></div>
            <button class="modal-close" id="modalClose">我知道了</button>
        </div>
    </div>

    <!-- 登录界面 -->
    <div id="authSection" class="auth-box">
        <h2>✦ 星脚本</h2>
        <p class="sub" id="modeText">登录后查看脚本</p>
        <div id="authError" class="error"></div>
        <div id="authSuccess" class="success"></div>
        <input type="email" id="authEmail" placeholder="邮箱地址">
        <input type="password" id="authPassword" placeholder="密码（至少6位）">
        <button class="btn-primary" id="authBtn">登录</button>
        <div class="switch"><span id="switchText">还没有账号？</span> <a href="#" id="switchLink">注册</a></div>
    </div>

    <!-- 主界面 -->
    <div id="mainSection" class="main-content">
        <div class="header">
            <h1 id="homeBtn">✦ 星脚本</h1>
            <button class="user-btn" id="profileBtn"><span id="userNameDisplay">我</span></button>
        </div>
        <div id="scriptList"></div>
        <div class="footer">© 2026 星脚本</div>
    </div>

    <!-- 个人中心 -->
    <div id="profilePage" class="profile-page">
        <div class="profile-card">
            <div class="p-name" id="profileName">用户</div>
            <div class="p-email" id="profileEmail">email@example.com</div>
            <div class="p-info">
                <div class="row"><span class="label">账号状态</span><span class="value" style="color:#69db7c">● 已登录</span></div>
                <div class="row"><span class="label">注册时间</span><span class="value" id="profileRegTime">今天</span></div>
                <div class="row"><span class="label">用户ID</span><span class="value" id="profileUid">--</span></div>
            </div>
            <div class="p-btns">
                <button class="btn-back" id="profileBackBtn">← 返回</button>
                <button class="btn-logout" id="profileLogoutBtn">退出登录</button>
            </div>
        </div>
    </div>
</div>

<!-- 头像选择器 -->
<div class="avatar-picker" id="avatarPicker">
    <div class="picker-box">
        <h3>🎨 选择头像</h3>
        <div class="picker-grid" id="avatarGrid"></div>
        <div class="picker-footer">
            <button class="btn-upload" id="pickerUpload">📷 相册</button>
            <button class="btn-close" id="pickerClose">取消</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============================================================
// 粒子动画
// ============================================================
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let w, h;
let particles = [];
const PARTICLE_COUNT = 50;
const MAX_DIST = 140;
const FLOW_SPEED = 0.15;

function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight}
window.addEventListener('resize',resize);resize();

class Particle{
    constructor(){this.x=Math.random()*w;this.y=Math.random()*h;this.r=Math.random()*2+1;this.dx=(Math.random()-0.5)*FLOW_SPEED*0.6;this.dy=(Math.random()-0.5)*FLOW_SPEED*0.6;this.phaseX=Math.random()*100;this.phaseY=Math.random()*100;this.speed=0.2+Math.random()*0.3}
    update(t){const wx=Math.sin(t*0.0004+this.phaseX)*0.12,wy=Math.cos(t*0.0005+this.phaseY)*0.12;this.x+=this.dx+wx*this.speed;this.y+=this.dy+wy*this.speed;if(this.x<-20)this.x=w+20;if(this.x>w+20)this.x=-20;if(this.y<-20)this.y=h+20;if(this.y>h+20)this.y=-20}
    draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle='rgba(160,200,255,0.4)';ctx.fill()}
}
for(let i=0;i<PARTICLE_COUNT;i++)particles.push(new Particle());

function drawLines(t){for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<MAX_DIST){const a=(1-dist/MAX_DIST)*0.25;ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(120,160,255,${a})`;ctx.lineWidth=0.5;ctx.stroke()}}}}
function animate(t){ctx.clearRect(0,0,w,h);const g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w*0.6);g.addColorStop(0,'rgba(30,60,120,0.06)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(const p of particles)p.update(t);drawLines(t);for(const p of particles)p.draw();requestAnimationFrame(animate)}
animate(0);

// ============================================================
// 公告栏
// ============================================================
const announcements=[
    {text:'🎉 星脚本 v2.0 已更新！新增搜索、置顶、公告栏功能',time:'2026-08-02'},
    {text:'📌 北极星加载器已更新至 v1.2，修复已知问题',time:'2026-08-01'},
    {text:'💡 点击脚本旁边的 ☆ 可置顶常用脚本',time:'2026-07-31'}
];
let curAnn=0,timer=null;
function renderAnn(i){
    document.getElementById('announceText').textContent=announcements[i].text;
    document.getElementById('announceTime').textContent=announcements[i].time;
    document.getElementById('announceDot').textContent=(i+1)+'/'+announcements.length;
}
function nextAnn(){curAnn=(curAnn+1)%announcements.length;renderAnn(curAnn)}
function prevAnn(){curAnn=(curAnn-1+announcements.length)%announcements.length;renderAnn(curAnn)}
renderAnn(0);timer=setInterval(nextAnn,5000);
document.getElementById('announceNext').onclick=function(){clearInterval(timer);nextAnn();timer=setInterval(nextAnn,5000)}
document.getElementById('announcePrev').onclick=function(){clearInterval(timer);prevAnn();timer=setInterval(nextAnn,5000)}
document.getElementById('announceClose').onclick=function(){document.getElementById('announcementBar').style.display='none';clearInterval(timer)}
document.getElementById('announcementBar').onclick=function(e){
    if(e.target.closest('button'))return;
    document.getElementById('modalTitle').textContent='📢 公告';
    document.getElementById('modalTime').textContent=announcements[curAnn].time;
    document.getElementById('modalBody').textContent=announcements[curAnn].text;
    document.getElementById('announceModal').classList.add('show');
}
document.getElementById('modalClose').onclick=function(){document.getElementById('announceModal').classList.remove('show')}
document.getElementById('announceModal').onclick=function(e){if(e.target===this)this.classList.remove('show')}

// ============================================================
// 脚本管理
// ============================================================
const SCRIPTS=[
    {name:"北极星加载器",version:"1.0",desc:"稳定的北极星脚本加载器",loader:'loadstring(game:HttpGet("https://raw.githubusercontent.com/zilinskaslandon/-/refs/heads/main/%E5%8C%97%E6%9E%81%E6%98%9F%E5%8A%A0%E8%BD%BD%E5%99%A8%E5%B7%B2%E5%8A%A0.lua"))()'},
    {name:"星脚本",version:"1.0",desc:"星脚本加载器",loader:'loadstring(game:HttpGet("https://raw.githubusercontent.com/zilinskaslandon/-/refs/heads/main/%E5%8C%97%E6%9E%81%E6%98%9F%E5%8A%A0%E8%BD%BD%E5%99%A8%E5%B7%B2%E5%8A%A0.lua"))()'}
];

function renderScripts(){
    let html='';
    SCRIPTS.forEach((s,i)=>{
        html+=`<div class="script-card">
            <div class="info"><div class="name">${s.name} <span class="version">v${s.version}</span></div>
            <div class="desc">${s.desc||''}</div></div>
            <button class="btn-copy" onclick="copyScript(${i})">📋 复制</button>
        </div>`;
    });
    document.getElementById('scriptList').innerHTML=html;
}
function copyScript(i){
    const loader=SCRIPTS[i].loader;
    navigator.clipboard.writeText(loader).then(()=>showToast('✅ 已复制')).catch(()=>{const ta=document.createElement('textarea');ta.value=loader;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('✅ 已复制')});
}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),2500)}

// ============================================================
// 登录注册
// ============================================================
let currentUser=null,isLogin=true;
function showError(msg){const el=document.getElementById('authError');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',4000)}
function showSuccess(msg){const el=document.getElementById('authSuccess');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',3000)}
function switchMode(){
    isLogin=!isLogin;
    document.getElementById('authBtn').textContent=isLogin?'登录':'注册';
    document.getElementById('switchText').textContent=isLogin?'还没有账号？':'已有账号？';
    document.getElementById('switchLink').textContent=isLogin?'注册':'登录';
    document.getElementById('modeText').textContent=isLogin?'登录后查看脚本':'注册后登录查看脚本';
    document.getElementById('authError').style.display='none';
    document.getElementById('authSuccess').style.display='none';
    document.getElementById('authEmail').value='';
    document.getElementById('authPassword').value='';
}

function loginRegister(){
    const email=document.getElementById('authEmail').value.trim();
    const password=document.getElementById('authPassword').value.trim();
    if(!email||!email.includes('@')||!email.includes('.')){showError('请输入正确的邮箱');return}
    if(password.length<6){showError('密码至少6位');return}
    let users={};try{users=JSON.parse(localStorage.getItem('users')||'{}')}catch(e){}
    if(isLogin){
        if(!users[email]){showError('账号不存在，请先注册');return}
        if(users[email]!==password){showError('密码错误');return}
        currentUser=email;showMain();showToast('✅ 登录成功')
    }else{
        if(users[email]){showError('邮箱已注册');return}
        users[email]=password;localStorage.setItem('users',JSON.stringify(users));
        showSuccess('✅ 注册成功！请登录');
        setTimeout(()=>{switchMode();document.getElementById('authEmail').value=email;document.getElementById('authPassword').value='';showToast('✅ 请登录')},1500)
    }
}

function showMain(){
    document.getElementById('authSection').style.display='none';
    document.getElementById('mainSection').style.display='block';
    document.getElementById('profilePage').style.display='none';
    renderScripts();
    if(currentUser){
        const name=currentUser.split('@')[0];
        document.getElementById('userNameDisplay').textContent=name.length>6?name.substring(0,6)+'...':name;
    }
}

function showProfile(){
    document.getElementById('mainSection').style.display='none';
    document.getElementById('profilePage').style.display='block';
    if(currentUser){
        document.getElementById('profileName').textContent=currentUser.split('@')[0];
        document.getElementById('profileEmail').textContent=currentUser;
        const uid='U'+currentUser.split('@')[0].substring(0,4).toUpperCase()+'01';
        document.getElementById('profileUid').textContent=uid;
        document.getElementById('profileRegTime').textContent=new Date().toLocaleString();
    }
}

function logout(){
    currentUser=null;
    document.getElementById('authSection').style.display='block';
    document.getElementById('mainSection').style.display='none';
    document.getElementById('profilePage').style.display='none';
    showToast('✅ 已退出');
}

function checkSession(){
    document.getElementById('authSection').style.display='block';
    document.getElementById('mainSection').style.display='none';
    document.getElementById('profilePage').style.display='none';
}

// ============================================================
// 所有事件绑定
// ============================================================
document.getElementById('authBtn').onclick=loginRegister;
document.getElementById('switchLink').onclick=function(e){e.preventDefault();switchMode()};
document.getElementById('profileBtn').onclick=function(){
    if(!currentUser){showToast('请先登录');return}
    showProfile()
};
document.getElementById('profileBackBtn').onclick=function(){showMain()};
document.getElementById('profileLogoutBtn').onclick=function(){logout()};
document.getElementById('homeBtn').onclick=function(){if(currentUser)showMain()};

// 头像选择器
const avatarGrid=document.getElementById('avatarGrid');
const defaultAvatars=['🌟','🚀','🎯','💎','🔥','⭐','🌊','🌙'];
avatarGrid.innerHTML=defaultAvatars.map(e=>
    `<div class="opt" style="background:linear-gradient(135deg,#4A6CF7,#8b5cf6)">${e}</div>`
).join('');
avatarGrid.querySelectorAll('.opt').forEach((el,idx)=>{
    el.onclick=function(){
        const emoji=defaultAvatars[idx];
        localStorage.setItem('avatar_'+currentUser,emoji);
        document.getElementById('avatarPicker').classList.remove('show');
        showToast('✅ 头像已更换');
    }
});
document.getElementById('pickerClose').onclick=function(){
    document.getElementById('avatarPicker').classList.remove('show')
};
document.getElementById('pickerUpload').onclick=function(){
    document.getElementById('fileInput').click()
};
document.getElementById('fileInput').onchange=function(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(ev){
        localStorage.setItem('avatar_'+currentUser,ev.target.result);
        document.getElementById('avatarPicker').classList.remove('show');
        showToast('✅ 头像已上传');
        document.getElementById('fileInput').value=''
    };
    reader.readAsDataURL(file)
};

// 点击个人中心名字打开头像选择器
document.querySelector('.p-name').onclick=function(){
    if(!currentUser){showToast('请先登录');return}
    document.getElementById('avatarPicker').classList.add('show')
};

checkSession();
</script>
</body>
</html>
